<!DOCTYPE html>

<html lang="ko">

    <head>

        <meta charset="utf-8">
        <title>grand kiwi's website</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=1.0, user-scalable=no">

        <link rel="shortcut icon" type="image⁄x-icon" href="/img/ticon.png">
        <link rel="stylesheet" href="/code/css/style.css">

        <meta property="og:type" content="website">
        <meta property="og:site_name" content="grand kiwi">
        <meta property="og:title" content="grand kiwi's Home!">
        <meta property="og:description" content="키위는 안셔요">
        <meta property="theme-color" content="#96FFCF">

        <meta name="theme-color" content="#96FFCF">

    </head>

   
    <body>

        <header>
            <h1 style='color:#BBFDAB;'>grand kiwi's site!</h1>
            <hr>
        </header>

        <gk-base>
            <noscript>You need to enable JavaScript to run this app.</noscript>
            <gk-sidebar>
                <input id="navcheck" role="button" type="checkbox">
                <label for="navcheck" aria-hidden="true" style="cursor: inherit;">
                    <span class="burger" style="cursor: pointer;">
                        <span class="bar">
                            <span class="visuallyhidden">Menu</span>
                        </span>
                    </span>
                </label>
                <nav id="menu">
                    <a href="/" data-discover="true">Home</a>
                </nav>
            </gk-sidebar>
            <gk-404>
                <div style="margin-left:15px; margin-right:15px;">
                
                    <h2 style="font-size:50px; margin-top:60px;"><b><span style="font-size:70px;">404</span><br>Not Found</b></h2>
                
                    <p style="font-size:15px; margin-bottom:90px;">
                        주소를 잘못 입력하셨거나 페이지를 찾을 수 없어요.. :(<br>
                        위쪽 사이드바를 통해 페이지를 이동해주세요!
                    </p>
                
                </div>
            </gk-404>
        </gk-base>

        <footer>
            <hr><img src='/img/logo.png' style='width:40px; height:40px;'> 
            <br> 
            <div style='line-height:10px;'>
               © grand kiwi's party  |  <a href='https://github.com/grandkiwi219' target="_blank">github</a>  |  <a href='https://invite.grandkiwi.kro.kr' target="_blank">discord</a>  |  <a href='https://github.com/grandkiwi219/grandkiwi.kro.kr' target="_blank">power</a>
            </div>
        </footer>

        <script>
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeSideBar();
                }
            });

            document.addEventListener('click', (e) => {
                const menu = document.getElementById('menu');

                if (menu && menu.contains(e.target) && e.target.tagName === 'A') {
                    closeSideBar();
                }
            });

            function closeSideBar() {
                document.getElementById("navcheck").checked = false;
            }
        </script>

    </body>

</html>
